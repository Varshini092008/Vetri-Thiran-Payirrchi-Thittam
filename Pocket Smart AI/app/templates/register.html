{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>📝 Create Account</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="/register" method="post">

        <label>Name</label>
        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <br>

    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

{% endblock %}
